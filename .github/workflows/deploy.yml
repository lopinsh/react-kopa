name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/lopinsh/react-kopa:latest
          build-args: |
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
            NEXT_PUBLIC_PUSHER_HOST=ejam.lumm.eu
            NEXT_PUBLIC_PUSHER_PORT=443
            NEXT_PUBLIC_PUSHER_TLS=true
            COMMIT_SHA=${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} \
            docker-compose.server.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/ejam-kopa/docker-compose.server.yml
          # Target the parent dir: scp -r into the existing prisma/ dir nested it (prisma/prisma) and left migrations stale
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} -r \
            prisma \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/ejam-kopa/

      - name: Run migrations
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "source /root/ejam-kopa/.env && \
             docker run --rm \
              --network ejam-kopa_default \
              -e DATABASE_URL=\"postgresql://\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@ejam-kopa-db:5432/\${POSTGRES_DB}?schema=public\" \
              -v /root/ejam-kopa/prisma:/app/prisma \
              node:20-alpine \
              sh -c 'cd /app && npm install prisma@6.19.2 --legacy-peer-deps 2>/dev/null && npx prisma migrate deploy'"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /root/ejam-kopa && \
             docker-compose -f docker-compose.server.yml pull && \
             docker-compose -f docker-compose.server.yml up -d"