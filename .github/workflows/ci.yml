name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Report-only until existing lint debt / locale drift is cleared (see docs/audit_report.md).
      # Remove `continue-on-error` once each passes on main.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: i18n parity
        run: npm run i18n:check
        continue-on-error: true
