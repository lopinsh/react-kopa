version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ejam-kopa-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: ejam-kopa-soketi
    restart: always
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: ${SOKETI_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${SOKETI_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${SOKETI_APP_SECRET}
    ports:
      - "6001:6001"

  app:
    image: ghcr.io/lopinsh/react-kopa:latest
    container_name: ejam-kopa-app
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      NEXTAUTH_URL: "https://ejam.lumm.eu"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      PUSHER_APP_ID: ${SOKETI_APP_ID}
      NEXT_PUBLIC_PUSHER_KEY: ${SOKETI_APP_KEY}
      PUSHER_SECRET: ${SOKETI_APP_SECRET}
      NEXT_PUBLIC_PUSHER_CLUSTER: "mt1"
      NEXT_PUBLIC_PUSHER_HOST: "soketi"
      NEXT_PUBLIC_PUSHER_PORT: "6001"
      NEXT_PUBLIC_PUSHER_TLS: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      soketi:
        condition: service_started

volumes:
  db_data:

    # Note: make sure your Dockerfile includes these ARG declarations before the build step:
    # ARG NEXT_PUBLIC_PUSHER_KEY
    # ARG NEXT_PUBLIC_PUSHER_HOST
    # ARG NEXT_PUBLIC_PUSHER_PORT
    # ENV NEXT_PUBLIC_PUSHER_KEY=$NEXT_PUBLIC_PUSHER_KEY
    # ENV NEXT_PUBLIC_PUSHER_HOST=$NEXT_PUBLIC_PUSHER_HOST
    # ENV NEXT_PUBLIC_PUSHER_PORT=$NEXT_PUBLIC_PUSHER_PORT
