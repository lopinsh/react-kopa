version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ejam-kopa-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: ejam-kopa-soketi
    restart: always
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: ${SOKETI_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${SOKETI_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${SOKETI_APP_SECRET}
    ports:
      - "6001:6001"

  app:
    image: ghcr.io/lopinsh/react-kopa:latest
    container_name: ejam-kopa-app
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      NEXTAUTH_URL: "https://ejam.lumm.eu"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # Test server: when ALLOW_DEV_PASSWORDS=true in /root/ejam-kopa/.env, seed accounts
      # (DEV_PASSWORDS in lib/auth.ts, except admin@local) can sign in. Off unless set.
      ALLOW_DEV_PASSWORDS: ${ALLOW_DEV_PASSWORDS:-false}
      # Feedback API token (unset = /api/feedback answers 404). Set it in /root/ejam-kopa/.env on the server.
      FEEDBACK_API_TOKEN: ${FEEDBACK_API_TOKEN:-}
      # Server → Soketi over the Docker network. The browser's settings (public host,
      # port 443, TLS) are baked into the image at build time, see deploy.yml.
      PUSHER_APP_ID: ${SOKETI_APP_ID}
      PUSHER_KEY: ${SOKETI_APP_KEY}
      PUSHER_SECRET: ${SOKETI_APP_SECRET}
      PUSHER_HOST: "soketi"
      PUSHER_PORT: "6001"
      PUSHER_TLS: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      soketi:
        condition: service_started

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/dev-disk-by-uuid-61316c2e-d3f3-489a-aa11-0f361612db56/Config/EJAM-APP/db_data