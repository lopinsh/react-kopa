<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<title>Ieeja no saraksta</title>
</head>
<body class="min-h-screen bg-background p-6 text-foreground">
<!-- Plain mock. Class strings are copied from components/discovery (GroupCard, CreateCard, filter/TitleSwitch, filter/chip-styles) and shell Header. The script builds each screen from small string helpers and stamps it into the 375 and 1280 boxes; layout follows the box width (container queries). -->

<h1 class="text-title mb-1">Ieeja no saraksta</h1>
<p class="mb-6 text-body-sm text-foreground-muted">Kā komūnas iekļaujas esošajā sarakstā: tie paši čipi, tās pašas kartītes, tā pati izveides kartīte. Četri ekrāni, katrs 375 un 1280 px platumā; ritini uz sāniem.</p>

<div id="stage" class="flex flex-col gap-10"></div>

<script>
  var CHIP = 'relative inline-flex h-7 items-center gap-1 whitespace-nowrap rounded-pill line shadow-control press text-meta px-3 bg-surface text-foreground';
  var CHOSEN = 'inline-flex h-7 items-center gap-1 whitespace-nowrap rounded-pill line shadow-control press text-meta px-3 tab-tint weight-strong text-foreground';
  var QUIET = 'relative inline-flex h-7 items-center gap-1 whitespace-nowrap rounded-pill px-3 text-meta text-foreground-muted border border-dashed border-border';
  var BTN = 'inline-flex h-11 items-center justify-center gap-1.5 whitespace-nowrap rounded-pill px-4 text-button @3xl:h-10 frame shadow-control press ';
  var PRIMARY = BTN + 'bg-primary text-primary-foreground';
  var OUTLINE = BTN + 'line bg-transparent text-foreground';
  var ICO = function (d, c) { return '<svg class="' + (c || 'size-6') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; };
  var CAM = '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>';
  var PIN = '<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>';
  var PLUS = '<path d="M12 5v14M5 12h14"/>';
  var X = '<path d="M18 6 6 18M6 6l12 12"/>';

  function head() {
    return '<header class="sticky top-0 z-10 flex h-header items-center gap-2 border-b border-border bg-surface px-3 @3xl:px-gutter"><span class="inline-flex items-center whitespace-nowrap font-heading weight-strong text-primary text-item @3xl:text-section"><span>Ejam <em class="weight-medium">kopā</em></span></span><div class="hidden min-w-0 flex-1 justify-center @3xl:flex"><div class="flex h-10 w-full max-w-2xl items-center rounded-pill line bg-surface px-3 text-body-sm text-foreground-muted">Meklēt grupas, cilvēkus</div></div><div class="ml-auto flex items-center gap-2"><span class="grid size-8 place-items-center rounded-full bg-primary text-tag text-primary-foreground">OK</span></div></header>';
  }
  function crumb(t) { return '<p class="text-meta text-foreground-muted">' + t + '</p>'; }
  /* TitleSwitch: current word strong with a short accent underline, others muted, each with a count. */
  function titleSwitch(cur) {
    var items = [['Grupas', 6], ['Pasākumi', 0]];
    return '<nav class="flex h-10 items-end gap-5 whitespace-nowrap">' + items.map(function (i) {
      var on = i[0] === cur;
      return '<span class="relative pb-2 text-title transition-colors ' + (on ? 'weight-strong text-foreground after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-6 after:bg-primary' : 'text-foreground-muted') + '">' + i[0] + '<span class="ml-1.5 text-meta weight-medium tabular-nums text-foreground-muted">' + i[1] + '</span></span>';
    }).join('') + '</nav>';
  }
  function filterLine(chips) {
    return '<div class="mb-4 mt-3 flex h-9 items-center gap-1.5 overflow-x-auto">' + chips + '</div>';
  }
  var tema = '<span class="' + CHOSEN + '">Hobiji</span>';
  var fotoChip = '<span class="' + CHOSEN + '">Fotogrāfija' + ICO(X, 'size-3.5') + '</span>';
  function kurChip(city) { return city ? '<span class="' + CHOSEN + '">' + ICO(PIN, 'size-3.5') + city + ICO(X, 'size-3.5') + '</span>' : '<span class="' + CHIP + '">' + ICO(PIN, 'size-3.5') + 'Kur</span>'; }

  /* Channel row: the GroupRow shape (cat-tile, name, category line, status pill). */
  function channelRow(city, people, status, first) {
    return '<div class="relative flex min-h-[5.5rem] items-center gap-3 py-3' + (first ? '' : ' border-t border-dashed border-border') + '"><span class="grid size-14 shrink-0 place-items-center rounded-item cat-tile">' + ICO(CAM) + '</span><span class="min-w-0 flex-1"><span class="line-clamp-2 block text-item text-foreground">Fotogrāfija · ' + city + '</span><span class="mt-0.5 flex items-center text-meta text-foreground-muted"><span class="mr-1.5 size-2 shrink-0 rounded-full bg-[var(--c)]"></span><span class="truncate">Hobiji · ' + people + '</span></span>' + status + '</span></div>';
  }
  var open = function (t) { return '<span class="mt-1.5 flex h-7 items-center rounded-item px-2 tab-tint text-meta text-foreground-muted">' + t + '</span>'; };
  var waiting = function (t) { return '<span class="mt-1.5 flex h-7 items-center rounded-item px-2 line text-meta text-foreground-muted">' + t + '</span>'; };

  /* Group card: GroupCard frame (card-note rounded-2xl line bg-surface shadow-card), banner, tag sticker, city pill, name, lines. */
  function card(o) {
    var banner = '<div class="relative h-28 banner-tint"><span class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-[var(--c)]">' + ICO(CAM, 'size-10') + '</span></div>';
    var tag = '<div class="absolute inset-x-4 -bottom-3 z-[2] flex min-w-0 gap-1.5"><span class="flex min-w-0 max-w-[60%] items-center rounded-pill line px-3 py-1 text-tag weight-strong shadow-control sticker"><span class="truncate">' + o.tag + '</span></span><span class="flex min-w-0 items-center gap-1 rounded-pill line bg-surface px-2 py-1 text-tag weight-strong text-foreground shadow-control">' + ICO(PIN, 'size-3.5 shrink-0 text-foreground-muted') + '<span class="truncate">' + o.city + '</span></span></div>';
    return '<article class="relative flex h-80 flex-col rounded-2xl line bg-surface shadow-card"><div class="relative shrink-0">' + banner + tag + '</div><div class="flex min-h-0 min-w-0 flex-1 flex-col gap-1.5 overflow-hidden px-5 pb-3 pt-6"><h3 class="line-clamp-2 text-item text-foreground">' + o.name + '</h3><p class="text-meta text-foreground-muted">' + o.meta + '</p>' + (o.note ? '<p class="line-clamp-2 text-meta weight-strong text-foreground">' + o.note + '</p>' : '') + '</div></article>';
  }
  var createCard = function (second) {
    return '<div class="card-note flex min-h-24 flex-col rounded-2xl border-[1.5px] border-dashed border-border bg-surface text-center"><span class="flex flex-1 flex-col items-center justify-center gap-1 px-4 py-5"><span class="mb-1 grid size-9 place-items-center rounded-full border-[1.5px] border-foreground-muted/60 text-foreground">' + ICO(PLUS, 'size-4') + '</span><span class="text-item text-foreground">Izveidot jaunu grupu</span><span class="text-meta text-foreground-muted">šajā tēmā</span>' + (second ? '<span class="mt-2 text-meta text-foreground-muted underline underline-offset-2">vai vienkārši pastāsti, ko meklē</span>' : '') + '</span></div>';
  };
  /* Phones list rows (GroupRow), from 3xl of the box a card grid. */
  var rowOf = function (name, meta, city, status) {
    return '<div class="relative flex min-h-[5.5rem] items-center gap-3 border-t border-dashed border-border py-3 first:border-t-0"><span class="grid size-14 shrink-0 place-items-center rounded-item cat-tile">' + ICO(CAM) + '</span><span class="min-w-0 flex-1"><span class="line-clamp-2 text-item text-foreground">' + name + '</span><span class="mt-0.5 flex items-center text-meta text-foreground-muted"><span class="mr-1.5 size-2 shrink-0 rounded-full bg-[var(--c)]"></span><span class="min-w-0 truncate">' + meta + '</span></span><span class="mt-1.5 flex h-7 items-center rounded-item px-2 text-meta ' + (status ? 'line text-foreground-muted' : 'tab-tint text-foreground') + '"><span class="min-w-0 truncate">' + (city || '') + '</span></span></span></div>';
  };
  var createRow = function (second) {
    return '<div class="flex min-h-[5.5rem] items-center gap-3 border-t border-dashed border-border py-3"><span class="grid size-14 shrink-0 place-items-center rounded-item border-[1.5px] border-dashed border-border">' + ICO(PLUS, 'size-5 text-foreground-muted') + '</span><span class="min-w-0 flex-1"><span class="block truncate text-item text-foreground">Izveidot jaunu grupu</span><span class="mt-0.5 block truncate text-meta text-foreground-muted">šajā tēmā</span>' + (second ? '<span class="mt-0.5 block truncate text-meta text-foreground-muted underline underline-offset-2">vai vienkārši pastāsti, ko meklē</span>' : '') + '</span></div>';
  };
  var both = function (rows, cells) { return '<div class="max-w-page @3xl:hidden">' + rows + '</div><div class="hidden gap-5 @3xl:grid @3xl:grid-cols-3">' + cells + '</div>'; };
  var grid = function (cells) { return '<div class="grid gap-5 @3xl:grid-cols-3">' + cells + '</div>'; };
  var wrap = function (inner) { return '<div class="mx-auto max-w-browse px-3 pb-8 pt-5 @3xl:px-gutter">' + inner + '</div>'; };
  var gA = function () { return card({ tag: 'Fotogrāfija', city: 'Jelgava', name: 'Jelgavas foto pastaigas', meta: 'Hobiji · 18 cilvēki', note: 'Meklē: modeli sestdienas pastaigai' }); };
  var gB = function () { return card({ tag: 'Fotogrāfija', city: 'Jelgava', name: 'Mobilā foto Jelgavā', meta: 'Hobiji · 7 cilvēki' }); };

  /* Channel bar: one line between the chip row and the grid; only when the tēma x city has a Meklē card or a group. */
  var bar = function (text) { return '<div class="mb-5 flex min-h-11 items-center gap-3 rounded-2xl line bg-surface px-4 py-2 shadow-card"><span class="min-w-0 flex-1 truncate text-body-sm text-foreground">' + text + '</span><span class="shrink-0 text-button-sm text-primary underline underline-offset-2">Skatīt</span></div>'; };
  var rowsA = function () { return rowOf('Jelgavas foto pastaigas', 'Hobiji', 'Jelgava · 18 cilvēki') + rowOf('Mobilā foto Jelgavā', 'Hobiji', 'Jelgava · 7 cilvēki'); };
  function variant(label, barHtml, rows, cells) {
    return '<p class="mb-2 mt-1 text-meta weight-strong text-foreground">' + label + '</p>' + filterLine(tema + fotoChip + kurChip('Jelgava')) + barHtml + both(rows, cells);
  }
  function s_c1() {
    var a = variant('a · Jelgavā kāds meklē', bar('Komūna: 2 cilvēki meklē biedrus →'), rowsA(), gA() + gB());
    var b = variant('b · nekā nav: josla nerādās', '', createRow(false), createCard(false));
    return head() + wrap(crumb('Hobiji › Fotogrāfija') + '<div class="mt-2">' + titleSwitch('Grupas') + '</div>' + a + '<div class="my-6 border-t border-dashed border-border"></div>' + b);
  }
  function s_c3() {
    return head() + wrap(crumb('Hobiji') + '<div class="mt-2">' + titleSwitch('Grupas') + '</div>' + filterLine(tema + fotoChip + kurChip('Jelgava')) +
      both(rowOf('Jelgavas foto pastaigas', 'Hobiji', 'Jelgava · 18 cilvēki') + rowOf('Mobilā foto Jelgavā', 'Hobiji', 'Jelgava · 7 cilvēki') + createRow(true), gA() + gB() + createCard(true)));
  }
  function s_c4() {
    var chips = ['Fotogrāfija', 'Šahs', 'Rokdarbi', 'Dārzkopība'].map(function (n, i) { return '<span class="' + (i === 0 ? CHOSEN : CHIP) + '">' + n + '</span>'; }).join('') + '<span class="' + QUIET + '">' + ICO(PLUS, 'size-3.5') + 'Cits</span>';
    var field = function (l, v) { return '<div><p class="mb-1 text-button-sm text-foreground">' + l + '</p><div class="flex h-11 items-center rounded-md px-3 text-body line bg-surface text-foreground @3xl:h-10 @3xl:text-body-sm">' + v + '</div></div>'; };
    var sheet = '<div class="relative mt-6 max-w-focus rounded-2xl bg-surface-elevated p-5 shadow-premium line"><div class="mb-3 flex items-start justify-between gap-3"><h2 class="text-section text-foreground">Ieteikt jaunu tēmu</h2><span class="grid size-10 place-items-center text-foreground-muted">' + ICO(X, 'size-5') + '</span></div><div class="flex flex-col gap-3"><p class="text-body-sm text-foreground-muted">Administratori to izskatīs. Izvēlies tēmu, kurai tā pieder.</p>' + field('Nosaukums', 'Go') + field('Tēma', 'Hobiji') + '<div class="mt-1 flex justify-end gap-2"><span class="' + OUTLINE + '">Atcelt</span><span class="' + PRIMARY + '">Ieteikt</span></div></div></div>';
    return head() + wrap(crumb('Hobiji') + '<div class="mt-2">' + titleSwitch('Grupas') + '</div>' + filterLine(tema) +
      '<div class="flex flex-wrap items-center gap-1.5">' + chips + '</div>' + sheet);
  }
  function s_c5() {
    var line = '<p class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-meta"><span class="inline-flex shrink-0 items-center gap-1.5 weight-medium text-foreground"><span class="size-2 shrink-0 rounded-full bg-[var(--c)]"></span>Hobiji</span><span class="text-foreground-muted">Fotogrāfija</span></p>';
    var chan = '<p class="text-meta"><span class="weight-strong text-primary underline underline-offset-2">Valmiera · Hobiji · Fotogrāfija →</span></p>';
    return head() + wrap('<div class="flex items-center gap-3"><span class="grid size-14 shrink-0 place-items-center rounded-item cat-tile">' + ICO(CAM) + '</span><div class="min-w-0"><h1 class="text-title text-foreground">Valmieras objektīvs</h1><div class="mt-1.5 grid gap-1">' + line + chan + '<p class="flex flex-wrap items-center gap-x-4 gap-y-1 text-meta text-foreground-muted"><span class="inline-flex items-center gap-1.5">' + ICO(PIN, 'size-4') + 'Valmiera</span><span class="inline-flex items-center gap-1.5">12 dalībnieki</span></p></div></div></div>');
  }

  var screens = [
    { label: 'C1 Komūnas josla', story: 'Kad ir izvēlēta tēma (Fotogrāfija) un pilsēta (Jelgava) un tur ir vismaz viena Meklē kartīte vai grupa, starp čipu rindu un režģi parādās vienas rindas josla: "Komūna: 2 cilvēki meklē biedrus → Skatīt", bez sejām. a) ir saturs. b) nekā nav: josla nerādās, redzama tikai izveides kartīte. Virsraksts paliek Grupas · Pasākumi.', fn: s_c1 },
    { label: 'C2 Izveides kartīte', story: 'Izveides kartīte paliek "Izveidot jaunu grupu"; zem tās kluss otrs ceļš "vai vienkārši pastāsti, ko meklē" tiem, kas negrib vadīt grupu (Meklē kartīte).', fn: s_c3 },
    { label: 'C3 Cits', story: 'Tēmu rindas beigās kluss "+ Cits"; tas atver esošo ieteikuma logu: "Ieteikt jaunu tēmu", nosaukums, tēma, Ieteikt; administratori to izskata.', fn: s_c4 },
    { label: 'C4 Grupas lapa', story: 'Grupas galvā zem kategorijas rindas saite "Valmiera · Hobiji · Fotogrāfija →" ved uz komūnu. Sānjosla nemainās.', fn: s_c5 }
  ];
  var stage = document.getElementById('stage');
  screens.forEach(function (s) {
    var sec = document.createElement('section');
    sec.innerHTML = '<h2 class="text-section">' + s.label + '</h2><p class="mb-3 mt-1 max-w-reading text-body-sm text-foreground-muted">' + s.story + '</p><div class="flex items-start gap-6 overflow-x-auto pb-4"></div>';
    var row = sec.lastChild;
    [375, 1280].forEach(function (w) {
      var box = document.createElement('div');
      box.className = '@container shrink-0 overflow-hidden rounded-2xl line bg-background';
      box.style.width = w + 'px';
      box.style.setProperty('--c', 'var(--cat-hobbies)');
      box.style.setProperty('--accent', 'var(--cat-hobbies)');
      box.innerHTML = s.fn();
      row.appendChild(box);
    });
    stage.appendChild(sec);
  });
</script>
</body>
</html>
