<div id="stage" class="flex flex-col gap-10"></div>

<script>
  var states = [
    { id: 'a0', label: 'A0 Pirms atvēršanas, skatās', story: 'Anna no Jelgavas skatās Šahu: "Šahs Jelgavā vēl nav atvērts · interesē 0 no 2", kas šī ir par vietu un šaha vietas tuvumā (Ozolnieki, Jelgavas novads). Vienīgā darbība ir "Mani interesē"; kamēr viņa nepiespiež, nekas nenotiek.', sub: 'Nav atvērts · interesē 0 no 2' },
    { id: 'a', label: 'A1 Pirms atvēršanas, ieinteresēta', story: 'Pēc pieskāriena Anna redz "Tu esi pirmais", Dalīties un Vairs neinteresē. Kad pievienosies otrs cilvēks, viņa saņems paziņojumu.', sub: 'Gaida otru cilvēku · 1 interesents' },
    { id: 'a2', label: 'A2 Jauns veids', story: 'Jānis grib Go, bet veida nav. "Ieteikt veidu" atver to pašu logu kā esošais ieteikuma logs: nosaukums un tēma. Administratori to izskata; apstiprināts veids kļūst redzams visiem.', sub: 'Ieteikts veids · gaida apstiprinājumu' },
    { id: 'b', mode: 'b0', label: 'B0 Atvērts, nepierakstījies', story: 'Nepierakstījies redz tikai skaitļus: cilvēku skaitu, Meklē kartītes bez vārdiem, grupas un pasākumus; sejas un sarunas nav. Vienīgā darbība ir "Mani interesē".', sub: 'Atvērts · 12 cilvēki · 2 grupas' },
    { id: 'b', mode: 'b1', label: 'B1 Atvērts, dalībnieks', story: 'Dalībnieks redz cilvēkus, pievieno Meklē kartīti, piespiež "Es arī" (skaitu redz tikai kartītes autors) un var "Vairs neinteresē". Saruna parādīsies K3.', sub: 'Atvērts · 12 cilvēki · 2 grupas' }
  ];
  var stage = document.getElementById('stage');
  states.forEach(function (s) {
    var wrap = document.createElement('section');
    wrap.innerHTML = '<h2 class="text-section">' + s.label + '</h2><p class="mb-3 mt-1 max-w-reading text-body-sm text-foreground-muted">' + s.story + '</p><div class="flex items-start gap-6 overflow-x-auto pb-4"></div>';
    var row = wrap.lastChild;
    [375, 1280].forEach(function (w) {
      var box = document.createElement('div');
      box.className = '@container shrink-0 overflow-hidden rounded-2xl line bg-background';
      box.style.width = w + 'px';
      ['head', 'title', s.id].forEach(function (id) { box.appendChild(document.getElementById(id).content.cloneNode(true)); });
      box.querySelectorAll(s.mode === 'b0' ? '[data-m]' : '[data-j]').forEach(function (e) { e.remove(); });
      box.querySelector('[data-sub]').textContent = s.sub;
      row.appendChild(box);
    });
    stage.appendChild(wrap);
  });
</script>
