<!-- Shared look of the Kanāli drawings: the site's light theme (moss, calm) and the utilities of app/globals.css. Injected into each drawing's <head> by DevelopmentService. -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.0"></script>
<style>
html:root{--primary:#4B5E3B;--primary-foreground:#ffffff;--background:#f4f4ef;--surface:#fdfdfb;--surface-elevated:#fdfdfb;--foreground:#1f221c;--foreground-muted:#5f6558;--border:#dcdfd4;--tint:#e8eae1;--on-cat:#ffffff;--tone-btn:var(--surface);--tone-btn-ink:var(--foreground);--danger:#A63A2E;--danger-foreground:#ffffff;--success:#3D6B34;--success-foreground:#ffffff;--warning:#8A5B0B;--warning-foreground:#ffffff;--scrim:rgb(0 0 0 / 0.3);--photo-chip:rgb(0 0 0 / 0.55);--photo-ink:#ffffff;--cat-travel:#4F7330;--cat-dancing:#A9452C;--cat-hobbies:#A55A12;--cat-community:#2F6A45;--cat-politics:#57493D;--cat-pets:#7A5E40;--cat-art:#7A4790;--cat-music:#57479A;--cat-religion:#586474;--cat-social:#A53A50;--cat-games:#8C3F72;--cat-sports:#3B55A0;--cat-family:#2B6489;--cat-wellbeing:#2E6B6F;--cat-education:#86650E;--role-owner:#4B5E3B;--role-owner-ink:#ffffff;--role-mod:#2B6489;--role-mod-ink:#ffffff;--role-member:#DCE9D2;--role-member-ink:#111111;--role-pending:#F3E1B5;--role-pending-ink:#111111;--line-width:1px;--line-color:var(--border);--frame-width:0px;--ink:var(--border);--press-shift:0px;--shadow-room:0px;--card-pad:1.25rem;--card-gap:1.25rem;--list-row:2.25rem;--list-pad:0.75rem;--search-edge:0px;--heading-weight:600;--icon-stroke:2;--tile-mix:20%;--tile-on:0%;--radius-md:0.375rem;--radius-lg:0.5rem;--radius-xl:0.75rem;--radius-2xl:1rem;--radius-3xl:1.5rem;--radius-4xl:2rem;--radius-pill:9999px;--radius-menu:14px;--radius-item:10px;--shadow-card:none;--shadow-control:none;--shadow-premium:0 10px 28px rgba(0, 0, 0, 0.12);--shadow-dialog:0 14px 34px rgba(0, 0, 0, 0.25);--theme-font-heading:var(--font-literata);--theme-font-body:var(--font-commissioner)}
:root { --font-literata: 'Literata'; --font-commissioner: 'Commissioner'; --accent: var(--cat-games); --c: var(--cat-games); }
html { --part-tabs-h: 2.25rem; color-scheme: light; --tab-mix: 12%; --tab-mix-hover: 20%; --band-mix-base: 24%; --role-live: #1DB954; --role-live-ink: #0B2414; }

<style type="text/tailwindcss">
@theme {

  --color-surface: var(--surface);
  --color-surface-elevated: var(--surface-elevated);
  --color-tint: var(--tint);
  --color-foreground: var(--foreground);
  --color-foreground-muted: var(--foreground-muted);
  --color-border: var(--border);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-danger: var(--danger);
  --color-success: var(--success);
  --color-role-owner: var(--role-owner);
  --color-role-owner-ink: var(--role-owner-ink);
  --color-role-mod: var(--role-mod);
  --color-role-mod-ink: var(--role-mod-ink);

  --color-role-member-ink: var(--role-member-ink);

  --color-role-pending-ink: var(--role-pending-ink);

  --shadow-card: var(--shadow-card);
  --shadow-premium: var(--shadow-premium);
  --shadow-control: var(--shadow-control);
  --radius-pill: var(--radius-pill);
  --radius-menu: var(--radius-menu);
  --radius-item: var(--radius-item);
  --spacing-header: 56px;
  --spacing-aside: 17.5rem;
  --spacing-gutter: clamp(1rem, 0.5rem + 2vw, 2rem);
  --spacing-section: clamp(2rem, 1.5rem + 2vw, 4rem);
  --container-browse: 1200px;
  --container-page: 760px;
  --container-focus: 560px;
  --container-reading: 66ch;
  --font-sans: var(--theme-font-body, var(--font-commissioner));
  --font-heading: var(--theme-font-heading, var(--font-literata));
}
@utility text-title { font-family: var(--font-heading), system-ui, sans-serif; font-weight: var(--heading-weight); font-synthesis-weight: none; font-size: clamp(1.625rem, 1.4rem + 1vw, 2.25rem); line-height: 1.1; letter-spacing: -0.015em; text-wrap-style: balance; }
@utility text-section { font-family: var(--font-heading), system-ui, sans-serif; font-weight: var(--heading-weight); font-synthesis-weight: none; font-size: clamp(1.25rem, 1.15rem + 0.45vw, 1.5rem); line-height: 1.2; letter-spacing: -0.01em; text-wrap-style: balance; }
@utility text-item { font-family: var(--font-heading), system-ui, sans-serif; font-weight: var(--heading-weight); font-synthesis-weight: none; font-size: clamp(1.0625rem, 1rem + 0.2vw, 1.1875rem); line-height: 1.3; text-wrap-style: balance; }
@utility text-body { font-size: 1rem; line-height: 1.6; font-weight: 400; --role-weight: 400; }
@utility text-body-sm { font-size: 0.9375rem; line-height: 1.5; font-weight: 400; --role-weight: 400; }
@utility text-button { font-size: 0.9375rem; line-height: 1.2; font-weight: 500; --role-weight: 400; }
@utility text-button-sm { font-size: 0.875rem; line-height: 1.2; font-weight: 500; --role-weight: 400; }
@utility text-meta { font-size: 0.8125rem; line-height: 1.45; font-weight: 400; --role-weight: 400; }
@utility text-tag { font-size: 0.75rem; line-height: 1.2; font-weight: 600; --role-weight: 400; letter-spacing: 0.02em; }

@utility weight-strong { font-weight: min(calc(var(--role-weight, 400) + 200), 1000); }
@utility human-note { font-style: italic; font-size: 0.875rem; color: var(--primary); }
@utility line { border-style: solid; border-width: var(--line-width); border-color: var(--line-color); }
@utility frame { border-style: solid; border-width: var(--frame-width); border-color: var(--line-color); }

@utility band-tint { background-color: color-mix(in srgb, var(--c) var(--band-mix, var(--band-mix-base)), var(--surface)); color: color-mix(in srgb, var(--on-cat) var(--tile-on), color-mix(in srgb, var(--c) 70%, var(--foreground))); }

@utility tab-tint { background-color: color-mix(in srgb, var(--c) var(--tab-mix), var(--surface)); }

@utility mark-tint { background-color: color-mix(in srgb, var(--accent) 22%, var(--surface)); color: var(--accent); }
@utility sticker { rotate: -2deg; transform-origin: left center; background-color: var(--c); color: var(--on-cat); --line-color: color-mix(in srgb, var(--c) 70%, var(--foreground)); }
</style>
