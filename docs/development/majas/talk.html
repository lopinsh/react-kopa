<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<style>/* the drawing has no Tailwind preflight, so the browser default margins on headings and paragraphs would show: zero them like the site does */h1,h2,h3,h4,p,ul,ol{margin:0}</style>
<title>Mājas: Ziņojumi un Laukums</title>
</head>
<body class="min-h-screen font-sans bg-background p-6 text-foreground">
<!-- The admin sidebar reads section[data-label][data-st][data-v][data-d] from this page. Cheap wireframe, drawn 13 Nov from the ledger rows in docs/development/majas/majas.md; grey boxes are placeholders. -->

<h1 class="text-title mb-1">Mājas: Ziņojumi un Laukums</h1>
<p class="text-meta text-foreground-muted">Versija v2 · publicēta 2026-11-13 15:06</p>
<p class="mb-6 max-w-reading text-body-sm text-foreground-muted">Divas dažādas lietas. Ziņojumi paliek: siena ar īsām atbildēm (M-12, M-14). Laukums ir tagad: cilvēki, kas skatās to pašu tēmu un vietu, redz cits citu un var parunāt (M-25..M-28); sarunas izgaist pēc aktivitātes.</p>

<div id="stage" class="flex flex-col gap-10"></div>

<script>
  var ICO = function (d, c) { return '<svg aria-hidden="true" class="' + (c || 'size-5') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; };
  var P = {
    home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    cal: '<path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
    news: '<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>',
    chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    send: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
    reply: '<path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>'
  };
  var ph = function (w) { return '<span class="block h-3 rounded bg-tint ' + (w || 'w-2/3') + '"></span>'; };
  var lines = function (n) { var o = ''; for (var i = 0; i < (n || 2); i++) o += ph(i ? 'w-1/2' : 'w-5/6'); return '<span class="grid w-full flex-1 gap-1.5">' + o + '</span>'; };
  var dot = function (c) { return '<span class="size-9 shrink-0 rounded-pill ' + (c || 'bg-tint') + '"></span>'; };
  var pill = function (t, on) { return '<span class="inline-flex h-8 items-center whitespace-nowrap rounded-pill px-3 text-button-sm ' + (on ? 'bg-primary text-primary-foreground' : 'line text-foreground') + '">' + t + '</span>'; };
  var box = 'rounded-2xl bg-surface p-3 shadow-card frame';
  var BAR = [['Atklāt', 'search'], ['Ziņas', 'chat'], ['Mājas', 'home'], ['Paziņojumi', 'bell'], ['Es', 'user']];
  function phoneBar(active) {
    return '<nav class="flex items-end justify-around border-t line bg-surface px-1 pb-2 pt-1">' + BAR.map(function (b) {
      var on = b[0] === active, mid = b[0] === 'Mājas';
      var ic = mid ? '<span class="-mt-4 grid size-12 place-items-center rounded-pill bg-primary text-primary-foreground shadow-premium">' + ICO(P[b[1]], 'size-6') + '</span>' : '<span class="py-1">' + ICO(P[b[1]]) + '</span>';
      return '<span class="flex w-16 flex-col items-center text-meta ' + (on ? 'text-foreground' : 'text-foreground-muted') + '">' + ic + '<span>' + b[0] + '</span></span>';
    }).join('') + '</nav>';
  }
  function deskBar(active) {
    var link = function (t, ic) { return '<span class="inline-flex items-center gap-1.5 text-body ' + (t === active ? 'text-foreground underline underline-offset-8' : 'text-foreground-muted') + '">' + ICO(P[ic], 'size-4') + t + '</span>'; };
    var round = function (ic) { return '<span class="grid size-9 place-items-center rounded-pill line text-foreground-muted">' + ICO(ic, 'size-4') + '</span>'; };
    return '<nav class="flex items-center gap-6 border-b line bg-surface px-8 py-3"><span class="text-item">Ejam Kopā</span>' + link('Mājas', 'home') + link('Atklāt', 'search')
      + '<span class="ml-auto flex items-center gap-2">' + round('<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>') + round(P.chat) + round(P.bell) + dot() + '</span></nav>';
  }
  function frame(w, active, body) {
    return w === 375 ? '<div class="grid gap-4 p-4">' + body + '</div>' + phoneBar(active) : deskBar(active) + '<div class="mx-auto grid max-w-browse gap-6 p-8">' + body + '</div>';
  }
  var D = '2026-11-13';
  var screens = [];

  var msg = function (me, w) { return '<div class="flex ' + (me ? 'justify-end' : '') + '"><span class="grid gap-1.5 rounded-2xl p-3 ' + (me ? 'bg-tint' : 'bg-surface frame') + ' ' + (w || 'w-3/4') + '">' + ph('w-full') + ph('w-1/2') + '</span></div>'; };
  var wallPost = function () { return '<div class="' + box + ' grid gap-2"><div class="flex items-center gap-2">' + dot() + ph('w-1/3') + '</div>' + lines(2) + '<div class="ml-6 grid gap-1.5 border-l-2 border-border pl-3"><div class="flex items-center gap-2">' + dot('bg-tint') + ph('w-1/2') + '</div><div class="flex items-center gap-2">' + dot() + ph('w-2/5') + '</div></div><span class="inline-flex items-center gap-1.5 text-meta text-foreground-muted">' + ICO(P.reply, 'size-4') + 'Atbildēt</span></div>'; };
  var composer = '<div class="flex items-center gap-2"><span class="h-10 flex-1 rounded-pill line px-4 text-body leading-10 text-foreground-muted">Uzraksti ziņojumu</span><span class="grid size-10 place-items-center rounded-pill bg-primary text-primary-foreground">' + ICO(P.send) + '</span></div>';
  var hubHead = '<div class="tone-fill grid gap-1 rounded-2xl p-4 text-[var(--on-cat)]"><p class="text-meta">Kopiena un vide</p><p class="text-title">Ziņojumi</p></div>';
  screens.push({ id: 'wall', st: 'progress', v: 'v2', label: 'Ziņojumi: siena ar īsām atbildēm (M-12, M-14)', story: 'Ziņojumi no grupām un cilvēkiem, īsas atbildes zem tiem, no turienes var rakstīt privāti (M-23). Lēni un paliek; reāllaika saruna ir Laukumā.', fn: function (w) {
    var posts = w === 375 ? wallPost() + wallPost() : '<div class="grid grid-cols-2 gap-4">' + wallPost() + wallPost() + wallPost() + wallPost() + '</div>';
    return frame(w, 'Atklāt', hubHead + composer + posts); } });
  var faces = function (n) { var o = ''; for (var i = 0; i < n; i++) o += '<span class="-ml-2 size-8 rounded-pill bg-tint ring-2 ring-[var(--surface)] first:ml-0"></span>'; return '<span class="flex">' + o + '</span>'; };
  var line = function (t, op) { return '<div class="flex items-start gap-2 ' + op + '">' + dot('bg-tint size-7') + '<span class="grid flex-1 gap-1"><span class="text-meta text-foreground-muted">' + t + '</span>' + ph('w-4/5') + '</span></div>'; };
  var talkBox = '<div class="flex items-center gap-2"><span class="h-10 flex-1 rounded-pill line px-4 text-body leading-10 text-foreground-muted">Uzraksti laukumā</span><span class="grid size-10 place-items-center rounded-pill bg-primary text-primary-foreground">' + ICO(P.send) + '</span></div>';
  function square(where, now, nudge, lns, note) {
    return '<div class="grid content-start gap-3 rounded-2xl bg-surface p-4 shadow-card frame"><div class="grid gap-2"><span class="grid"><span class="text-meta text-foreground-muted">Laukums</span><span class="text-item">' + where + '</span></span><span class="flex items-center gap-2">' + faces(Math.min(now, 4)) + '<span class="text-meta">Šeit tagad: ' + now + '</span></span></div>'
      + (note ? '<p class="rounded-xl bg-tint px-3 py-2 text-meta">' + note + '</p>' : '')
      + '<p class="rounded-xl line px-3 py-2 text-body-sm">' + nudge + '</p><div class="grid gap-3">' + lns + '</div>' + talkBox + '</div>';
  }
  var busy = line('Anna · pirms 3 h', 'opacity-40') + line('Jānis · pirms 1 h', 'opacity-70') + line('Marta · pirms 10 min', '') + line('Pēteris · tikko', '');
  var quiet = line('Ilze · pirms 3 dienām', 'opacity-70') + line('Kārlis · vakar', '');
  var grid3 = '<div class="grid content-start gap-4"><div class="flex items-baseline gap-2"><h2 class="text-title">Galda spēles · Jelgava</h2><span class="text-meta text-foreground-muted">13 grupas</span></div><div class="grid grid-cols-2 gap-4">' + [1, 2, 3, 4].map(function () { return '<div class="grid gap-2 ' + box + '"><span class="block h-24 rounded-xl bg-tint"></span>' + lines(2) + '</div>'; }).join('') + '</div></div>';
  screens.push({ id: 'square', label: 'Laukums: tu esi tur, kur skaties (M-25, M-27, M-28)', story: 'Skatoties Atklāt › Galda spēles › Jelgava, tu stāvi šajā laukumā. Redzams, kas šeit tagad; uzruna aicina runāt laukumā, nevis rakstīt kādam vienam. Rosīgā laukumā rindas izgaist pēc ~4 stundām. Telefonā laukums ir lapa, ko atver no peldoša "Šeit tagad: 5".', fn: function (w) {
    var sq = square('Galda spēles · Jelgava', 5, 'Šeit ir 5 cilvēki, kam interesē galda spēles. Droši uzraksti.', busy);
    if (w === 375) return frame(w, 'Atklāt', sq);
    return frame(w, 'Atklāt', '<div class="grid grid-cols-[1fr_24rem] gap-8">' + grid3 + sq + '</div>'); } });
  screens.push({ id: 'elastic', label: 'Klusais laukums un elastīgie laukumi (M-26, M-28)', story: 'Novuss · Bauska: šobrīd neviena. Laukums paplašinās uz augšu un rāda, kas tagad skatās Galda spēles visā Latvijā. Klusā laukumā sarunas paliek dienām, lai nākamais saprot noskaņu.', fn: function (w) {
    var sq = square('Galda spēles · Latvija', 2, 'Šeit ir 2 cilvēki, kam interesē galda spēles. Droši uzraksti.', quiet, 'Novuss · Bauska šobrīd tukšs: rādām Galda spēles visā Latvijā.');
    if (w === 375) return frame(w, 'Atklāt', sq);
    return frame(w, 'Atklāt', '<div class="grid grid-cols-[1fr_24rem] gap-8">' + grid3.replace('Galda spēles · Jelgava', 'Novuss · Bauska').replace('13 grupas', '1 grupa') + sq + '</div>'); } });

  var MONTHS = ['jan.', 'febr.', 'marts', 'apr.', 'maijs', 'jūn.', 'jūl.', 'aug.', 'sept.', 'okt.', 'nov.', 'dec.'];
  function dayLabel(d) { var p = d.split('-'); return Number(p[2]) + '. ' + MONTHS[Number(p[1]) - 1]; }
  var stage = document.getElementById('stage');
  function addBox(row, s, w) {
    var col = document.createElement('div');
    col.className = w === 375 ? 'shrink-0' : 'w-full';
    var b = document.createElement('div');
    b.className = '@container relative overflow-hidden rounded-2xl line bg-background';
    b.setAttribute('data-w', w);
    if (w === 375) { b.style.width = '375px'; } else { b.style.width = '100%'; b.style.maxWidth = w + 'px'; b.style.minWidth = '64rem'; }
    var fl = w === 375 ? { t: '1.625rem', s: '1.25rem', i: '1.0625rem', g: '1rem' } : { t: '2.2rem', s: '1.5rem', i: '1.16rem', g: '2rem' };
    b.style.setProperty('--type-title-size', fl.t);
    b.style.setProperty('--type-section-size', fl.s);
    b.style.setProperty('--type-item-size', fl.i);
    b.style.setProperty('--spacing-gutter', fl.g);
    b.style.setProperty('--accent', 'var(--cat-community)');
    b.innerHTML = s.fn(w);
    col.appendChild(b);
    row.appendChild(col);
  }
  var row;
  screens.forEach(function (s) {
    var section = document.createElement('section');
    section.id = s.id;
    section.dataset.label = s.label;
    section.dataset.st = s.st || 'new';
    section.dataset.v = s.v || 'v1';
    section.dataset.d = D;
    section.innerHTML = '<h2 class="text-section">' + s.label + ' <span class="ml-1 inline-flex h-5 items-center rounded-pill px-2 align-middle text-meta line text-foreground">' + (s.st === 'progress' ? 'Procesā' : 'Jauns') + '</span> <span class="text-meta weight-medium text-foreground-muted">' + (s.v || 'v1') + ' · ' + dayLabel(D) + '</span></h2><p class="mb-3 mt-1 max-w-reading text-body-sm text-foreground-muted">' + s.story + '</p>';
    row = document.createElement('div');
    row.className = 'flex flex-col items-start gap-6 overflow-x-auto pb-4';
    [375, 1280].forEach(function (w) { addBox(row, s, w); });
    section.appendChild(row);
    stage.appendChild(section);
  });
</script>
</body>
</html>
